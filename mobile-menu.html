<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>KUNEBERG — Wireframe (Мобільне меню)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--line:#d6d6d6;--line-strong:#a8a8a8;--g-500:#909090;--g-600:#6b6b6b;--g-800:#2a2a2a;--ink:#1c1c1c;}
*{box-sizing:border-box;}
body{margin:0;display:flex;justify-content:center;background:#eae8e2;padding:40px 20px;}
.page{width:390px;max-width:100%;height:844px;background:#fff;font-family:'Montserrat',Arial,sans-serif;color:var(--ink);position:relative;}
.modal-label{position:absolute;top:-30px;left:0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--g-500);font-weight:700;}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:62px;border-bottom:1px solid var(--line-strong);}
.logo{font-size:16px;font-weight:800;}
.close{width:34px;height:34px;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;}
.nav{display:flex;flex-direction:column;padding:12px 20px;}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:17px 0;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;color:var(--ink);text-decoration:none;}
.section-label{padding:20px 20px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--g-500);font-weight:700;}
.contact-row{display:flex;align-items:center;gap:10px;padding:12px 20px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);}
.lang-row{display:flex;gap:10px;padding:16px 20px;}
.lang-pill{border:1px solid var(--line-strong);padding:7px 14px;font-size:12px;font-weight:700;}
.lang-pill.active{background:var(--g-800);color:#fff;border-color:var(--g-800);}
.bottom{position:absolute;bottom:0;left:0;right:0;padding:16px 20px 20px;border-top:1px solid var(--line-strong);}
.btn{display:flex;align-items:center;justify-content:center;padding:16px;font-size:13px;font-weight:700;border:1px solid var(--g-800);background:var(--g-800);color:#fff;text-transform:uppercase;letter-spacing:.02em;}
</style>
</head>
<body>

<div class="page">
  <div class="modal-label">МОБІЛЬНЕ МЕНЮ – відкривається тапом на іконку-гамбургер у шапці</div>
  <div class="top">
    <div class="logo">KUNEBERG</div>
    <div class="close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1c1c1c" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
  </div>
  <nav class="nav">
    <a>Продукція <span>→</span></a>
    <a>Під замовлення <span>→</span></a>
    <a>Наші роботи <span>→</span></a>
    <a>Виробництво <span>→</span></a>
    <a>FAQ <span>→</span></a>
    <a>Контакти <span>→</span></a>
  </nav>
  <div class="section-label">Зв'язок</div>
  <div class="contact-row"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1c1c1c" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg> +38 (067) 899-20-00</div>
  <div class="contact-row" style="border-bottom:none;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1c1c1c" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.4 8.4 0 0 1 12.5 3a8.5 8.5 0 0 1 8.5 8.5z"></path></svg> Telegram / Viber</div>
  <div class="lang-row">
    <div class="lang-pill active">UA</div>
    <div class="lang-pill">RU</div>
  </div>
  <div class="bottom">
    <button class="btn">Отримати прорахунок</button>
  </div>
</div>

</body>
</html>
